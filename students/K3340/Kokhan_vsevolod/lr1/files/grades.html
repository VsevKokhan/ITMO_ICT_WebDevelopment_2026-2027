<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Мой журнал</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .add-button {
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .add-button:hover {
            background: #4338ca;
        }

        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .subject-card h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
        }

        .grades {
            display: flex;
            gap: 10px;
        }

        .grade {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef2ff;
            color: #4f46e5;

            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .empty h2 {
            margin: 10px 0;
        }

        .empty p {
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Мой журнал</h1>

        <a href="/grades/add" class="add-button">
            + Добавить оценку
        </a>
    </div>

    <!-- GRADES -->

</div>

</body>
</html>
